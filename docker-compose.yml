# PlotMesh v2.0 · 群晖 Container Manager / Docker Compose 生产部署
#
# NAS 目录建议：/volume1/docker/plotmesh
# 1) 复制 .env.nas.example 为 .env，并填写 API Key（按需）
# 2) docker compose up -d --build
# 3) 局域网访问：http://10.118.118.10:18180
#
# 安全边界：只公开 client:80；server:3001 仅在 Docker 内部网络可见。

name: plotmesh

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: plotmesh-server:2.0.0
    container_name: plotmesh-server
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      PORT: "3001"
      PLOTMESH_DATA_DIR: /data
      PLOTMESH_UPLOADS_DIR: /app/uploads
      # 必须为 true，保证 client 容器可以访问后端；后端端口不映射到 NAS。
      PLOTMESH_REMOTE_ACCESS: "true"
      # 群晖 LAN 部署默认要求账号登录，且首位管理员创建后禁止自助注册。
      PLOTMESH_AUTH_REQUIRED: "true"
      PLOTMESH_AUTH_ALLOW_SELF_REGISTER: "false"
    volumes:
      # 账号、项目、画布、JWT secret、server 配置、外部 AI token
      - ./data:/data
      # 上传文件与图片 AI 生成的图片
      - ./uploads:/app/uploads
    expose:
      - "3001"
    security_opt:
      - no-new-privileges:true
    networks:
      - plotmesh

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: plotmesh-client:2.0.0
    container_name: plotmesh-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${PLOTMESH_HTTP_PORT:-18180}:80"
    security_opt:
      - no-new-privileges:true
    networks:
      - plotmesh

networks:
  plotmesh:
    driver: bridge
